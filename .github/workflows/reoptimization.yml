name: Reoptimization Scenario

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_engine.py -q
